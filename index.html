<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinFam</title>
<meta name="theme-color" content="#4B3AAF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinFam">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3FF; --surface:#FFFFFF; --surface2:#F1EEFB; --band:#ECE8F8; --ink:#231B4D; --muted:#6D6890; --line:#E8E4F5;
  --brand:#4B3AAF; --brand-ink:#FFFFFF; --hero1:#5A47C8; --hero2:#36288C; --accent:#FFC93C; --track:#E9E5F7;
  --usd:#4B3AAF; --usd-soft:#ECE8FC; --bs:#A86200; --bs-soft:#FFF0C7;
  --warn:#FF8A1F; --danger:#E5484D; --danger-soft:#FDE4E6; --focus:#1E6BF0; --on-usd:#FFFFFF;
  --shadow:0 1px 2px rgba(35,27,77,.08),0 4px 14px rgba(35,27,77,.07);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141127; --surface:#1E1A38; --surface2:#262147; --band:#2A2450; --ink:#ECEAFB; --muted:#A7A2C9; --line:#332D5C;
    --brand:#4B3AAF; --brand-ink:#FFFFFF; --hero1:#4B3AAF; --hero2:#2A1F6E; --accent:#FFC93C; --track:#332D5C;
    --usd:#AE9EFF; --usd-soft:#2C2558; --bs:#FFC93C; --bs-soft:#3A2F12;
    --warn:#FFA149; --danger:#FF6B70; --danger-soft:#3D1D25; --focus:#8AB4FF; --on-usd:#141127;
    --shadow:0 0 0 1px #2E2855;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#141127; --surface:#1E1A38; --surface2:#262147; --band:#2A2450; --ink:#ECEAFB; --muted:#A7A2C9; --line:#332D5C;
    --brand:#4B3AAF; --brand-ink:#FFFFFF; --hero1:#4B3AAF; --hero2:#2A1F6E; --accent:#FFC93C; --track:#332D5C;
    --usd:#AE9EFF; --usd-soft:#2C2558; --bs:#FFC93C; --bs-soft:#3A2F12;
    --warn:#FFA149; --danger:#FF6B70; --danger-soft:#3D1D25; --focus:#8AB4FF; --on-usd:#141127;
    --shadow:0 0 0 1px #2E2855;
    color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-weight:500}
h1{font-size:1.2rem;margin:0;display:flex;align-items:center;gap:.55rem}
h2{font-size:1.1rem;margin:0 0 .6rem}
h3{font-size:1rem;margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top-in{max-width:780px;margin:0 auto;padding:.75rem 1rem 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.tasa{display:flex;align-items:center;gap:.45rem;font-size:.88rem;color:var(--brand-ink)}
.tasa input{width:7rem;padding:.35rem .55rem;border:0;border-radius:4px;background:rgba(255,255,255,.2);color:var(--brand-ink)}
.tasa input::placeholder{color:rgba(255,255,255,.75)}
.tasa input:focus-visible{outline-color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;margin-top:.5rem}
.tabs .tab{font-size:.78rem;padding-left:.15rem;padding-right:.15rem}
.tab{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.85rem;border:0;background:transparent;padding:.6rem .4rem .55rem;line-height:1.2;cursor:pointer;font-weight:500;color:rgba(255,255,255,.75);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .ico{color:var(--accent)}
.tab:focus-visible{outline-color:#fff;outline-offset:-3px}
main{max-width:780px;margin:0 auto;padding:.8rem .8rem 3rem}
.aviso{display:flex;gap:.55rem;align-items:flex-start;background:var(--bs-soft);color:var(--ink);border-radius:6px;padding:.6rem .8rem;font-size:.92rem;margin-bottom:.8rem}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.mes strong{font-weight:500;font-size:1.05rem;text-transform:capitalize}
.icon-btn{display:grid;place-items:center;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:50%;width:2.4rem;height:2.4rem;cursor:pointer;font-size:1.2rem;color:var(--ink)}
.panel{background:var(--surface);border-radius:14px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.panel-tit{font-weight:500;margin-bottom:.3rem}
.panel-head{display:flex;justify-content:space-between;align-items:baseline}
.cuenta-row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.cuenta-row:last-child{border-bottom:0}
.cuenta-row>span:first-child{color:var(--muted)}
.cuenta-row .num{font-size:1.75rem;font-weight:400;line-height:1.2}
.cuenta-row .pos{color:var(--usd)}
.cuenta-row .neg{color:var(--danger)}
.barra{height:16px;border-radius:2px;background:var(--track);overflow:hidden;margin:.5rem 0 .3rem}
.barra i{display:block;height:100%;background:var(--usd);max-width:100%}
.barra.alerta i{background:var(--warn)}
.barra.exceso i{background:var(--danger)}
.barra-pie{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.meta-txt{font-size:.9rem;color:var(--muted)}
.ahorro-cifra{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.ahorro-cifra .num{font-size:2.2rem;font-weight:400;line-height:1.15;color:var(--usd)}
.ahorro-cifra span{color:var(--muted)}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.2rem}
.btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:6px;padding:.75rem .9rem;cursor:pointer;font-weight:500;color:var(--ink)}
.btn-usd{background:var(--brand);color:#fff}
.btn-sm{padding:.35rem .7rem;border-radius:4px;font-size:.86rem}
.btn-link{background:none;border:0;color:var(--usd);font-weight:500;cursor:pointer;padding:.3rem 0}
.btn-pagar{background:none;border:0;color:var(--usd);font-weight:500;cursor:pointer;padding:.2rem 0;font-size:.86rem}
.btn-del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:.2rem .4rem;border-radius:4px}
.btn-del:hover{color:var(--danger)}
section{margin-bottom:1.3rem}
section>h2{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;font-weight:500;color:var(--ink);margin:0 0 .6rem;padding:0 .15rem}
section>h2 .ico{color:var(--brand);width:1.3rem;height:1.3rem}
.sec-head{display:block}

.dona-tit{font-size:1rem;color:var(--ink);text-transform:capitalize}
.dona-total{font-size:3rem;font-weight:400;color:var(--usd);line-height:1.1;margin:.1rem 0 .6rem}
.dona{width:min(230px,70vw);height:auto;display:block;margin:0 auto}
.dona text{fill:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.leyenda{list-style:none;margin:1rem 0 0;padding:0;text-align:left}
.leyenda li{display:grid;grid-template-columns:2rem 1fr auto 2.6rem;gap:.6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);font-size:.95rem}
.leyenda .pt{width:.8rem;height:.8rem;border-radius:50%}
.leyenda .pc{color:var(--muted);text-align:right;font-size:.85rem}
.dona-pie{margin-top:.6rem;color:var(--usd);font-size:.9rem}
.periodo{background:var(--surface);border-radius:14px;margin-bottom:.7rem;overflow:hidden;box-shadow:var(--shadow)}
.periodo>summary{list-style:none;cursor:pointer;padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.periodo>summary::-webkit-details-marker{display:none}
.periodo>summary::after{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:.3rem;flex:none;transition:transform .15s}
.periodo[open]>summary::after{transform:rotate(-135deg)}
.p-rango{font-weight:500}
.p-hoy{font-size:.75rem;background:var(--brand);color:#fff;padding:.1rem .45rem;border-radius:3px;margin-left:.4rem;font-weight:500}
.p-estado{white-space:nowrap;font-size:.9rem;color:var(--usd);margin-left:auto;text-align:right;font-weight:500}
.p-estado.mal{color:var(--danger)}
.p-cuerpo{padding:0 1rem 1rem;border-top:1px solid var(--line)}
.cobros{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 .4rem}
.cobro{font-size:.85rem;padding:.25rem .55rem;border-radius:4px;background:var(--surface2);color:var(--muted)}
.cobro.ok{background:var(--usd-soft);color:var(--ink)}
.cobro.bs.ok{background:var(--bs-soft)}
.p-meta{font-size:.86rem;color:var(--muted);margin:.2rem 0 .4rem}
.items{list-style:none;margin:0 -1rem;padding:0}
.item{display:grid;grid-template-columns:2.4rem 2.2rem 1fr auto;gap:.6rem;align-items:center;padding:.65rem 1rem;border-top:1px solid var(--line)}
.dia{font-size:.75rem;color:var(--muted);line-height:1.15;text-align:center;text-transform:capitalize}
.dia b{display:block;font-size:1.3rem;font-weight:400;color:var(--ink)}
.item-nom{font-weight:400;line-height:1.3}
.item-sub{font-size:.8rem;color:var(--muted);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-top:.15rem}
.item-der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.2rem}
.item-der .num{font-weight:500}
.item.pagado{background:var(--surface2)}
.item.pagado .item-nom{color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:500;padding:.05rem .4rem;border-radius:3px}
.chip-usd{background:var(--usd-soft);color:var(--usd)}
.chip-bs{background:var(--bs-soft);color:var(--bs)}
.chip-tipo{background:var(--surface2);color:var(--muted)}
.hecho{font-size:.84rem;color:var(--muted);font-weight:500;background:none;border:0;cursor:pointer;padding:0}
.mini-barra{width:6.5rem;height:8px;border-radius:2px;background:var(--track);overflow:hidden}
.mini-barra i{display:block;height:100%;background:var(--usd)}
.mini-barra.alerta i{background:var(--warn)}
.mini-barra.exceso i{background:var(--danger)}
.cierre{margin-top:.2rem;background:var(--surface2);border-radius:6px;padding:.7rem .8rem;font-size:.92rem}
.cierre-row{display:flex;justify-content:space-between;gap:.6rem;padding:.15rem 0}
.cierre-row.total{font-weight:500;font-size:1.05rem;border-top:1px solid var(--line);margin-top:.3rem;padding-top:.45rem;color:var(--usd)}
.cierre-row.mal{color:var(--danger)}
.tip{display:flex;gap:.5rem;align-items:flex-start;font-size:.88rem;margin-top:.55rem;padding:.5rem .65rem;border-radius:4px;background:var(--bs-soft)}
.tip.mal{background:var(--danger-soft)}
.vacio{text-align:center;padding:1.4rem 1rem;color:var(--muted)}
.vacio p{margin:.2rem 0 .8rem}
.sobres{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sobre{padding:.75rem 1rem;border-top:1px solid var(--line)}
.sobre:first-child{border-top:0}
.sobre-top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.sobre-top b{font-weight:400;font-size:1.02rem}
.sobre-top span{font-weight:500}
.sobre-top>span:last-child{white-space:nowrap}
.sobre-top span small{font-weight:400;color:var(--muted);font-size:.85rem}
.sobre .barra{height:18px;position:relative}
.sobre .barra em{position:absolute;left:.5rem;top:50%;transform:translateY(-50%);font-style:normal;font-size:.74rem;font-weight:500;color:var(--ink);white-space:nowrap}
.sobre small.ayuda{display:block}
.movs{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.mov{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:.5rem;align-items:center;padding:.65rem 1rem;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov-cat{font-weight:400;display:block;line-height:1.3}
.mov-sub{font-size:.8rem;color:var(--muted)}
.mov-der{text-align:right}
.mov-der .num{font-weight:500;display:block}
.mov-ingreso .mov-der .num,.mov-ahorro .mov-der .num{color:var(--usd)}
.hogar{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-top:.8rem}
.hogar div{background:var(--surface2);border-radius:6px;padding:.6rem}
.hogar small{display:block;color:var(--muted);font-size:.82rem}
.reparto{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.5rem;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:.7rem 1rem;border-radius:4px;font-size:.92rem;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog#hoja{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(680px,100%);max-width:100%;max-height:92vh;max-height:92dvh;border-radius:12px 12px 0 0;margin:auto auto 0;overflow:auto}
@media (min-width:720px){dialog#hoja{border-radius:8px;margin:auto}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.hoja{padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
.hoja-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.hoja-head .icon-btn{box-shadow:none;background:var(--surface2)}
.campo{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.campo label,.campo .lbl{font-size:.88rem;font-weight:500;color:var(--muted)}
.campo input,.campo select,.tabla input,.tabla select{padding:.6rem .7rem;border:0;border-bottom:2px solid var(--line);border-radius:4px 4px 0 0;background:var(--surface2);color:var(--ink);width:100%;min-width:0}
.campo input:focus,.tabla input:focus,.campo select:focus,.tabla select:focus{border-bottom-color:var(--brand);outline:none}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:6px;gap:3px}
.seg button{border:0;background:transparent;padding:.45rem .95rem;border-radius:4px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ayuda{font-size:.84rem;color:var(--muted)}
.err{color:var(--danger);font-size:.88rem;font-weight:500;min-height:1.2em}
.hoja-pie{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.6rem}
.hoja-pie .btn:not(.btn-usd){box-shadow:none;background:transparent;color:var(--usd)}
.tabla{display:grid;gap:.6rem;margin-bottom:.6rem}
.fila{display:grid;gap:.45rem;background:var(--surface2);border-radius:6px;padding:.65rem;position:relative}
.fila input,.fila select{background:var(--surface)}
.fila-plan{grid-template-columns:2fr 1fr 1fr}
.fila-plan .full{grid-column:1/-1}
.fila-ing{grid-template-columns:.8fr 1fr 1fr 1.6fr auto}
.fila .btn-del{align-self:center}
.fila-plan .btn-del{position:absolute;top:.3rem;right:.3rem}
.fila-plan>:first-child{padding-right:1.6rem}
.mini-lbl{font-size:.74rem;color:var(--muted);display:block;margin-bottom:.15rem}
.quien{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:560px){
  .fila-ing{grid-template-columns:1fr 1fr}
  .fila-ing .ing-nota{grid-column:1/-1}
  .fila-plan{grid-template-columns:1fr 1fr}
  .fila-plan>:first-child{grid-column:1/-1}
  .cuenta-row .num{font-size:1.5rem}
}
.hg{width:100%;height:auto;display:block}
.hg-grid{stroke:var(--line);stroke-width:1}
.hg-eje{fill:var(--muted);font-size:10px}
.hg-mes{fill:var(--muted);font-size:11px;text-transform:capitalize}
.hg-mes.act{fill:var(--ink);font-weight:700}
.hg-act{fill:var(--surface2)}
.hg-ley{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.hg-ley i{display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
.aviso .ico,.tip .ico{margin-top:.15em;color:var(--bs)}
.tip.mal .ico{color:var(--danger)}
.logo-img{width:2.5rem;height:2.5rem;border-radius:11px;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
h1{font-weight:700;letter-spacing:-.01em}
.logo{width:2.1rem;height:2.1rem;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.logo .ico{width:1.2rem;height:1.2rem}
.tab .ico{width:1.25rem;height:1.25rem}
.tasa .ico{width:1rem;height:1rem;opacity:.9}
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;border-radius:18px;padding:1.1rem 1.1rem 1rem;margin-bottom:1rem;box-shadow:0 10px 24px rgba(54,40,140,.32);position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero::before{width:180px;height:180px;right:-50px;top:-60px}
.hero::after{width:120px;height:120px;left:-40px;bottom:-60px}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.hero-lbl{color:var(--accent);font-size:.92rem;display:flex;align-items:center;gap:.4rem;text-transform:none}
.hero-num{font-size:2.6rem;font-weight:500;line-height:1.1;margin:.25rem 0}
.hero-sub{font-size:.85rem;opacity:.88}
.hero-msg{margin:.75rem 0 .8rem;font-size:.9rem;opacity:.95}
.tiles+.hero-msg{margin:.7rem 0 0}
.ring{width:88px;height:88px;flex:none}
.ring-t{fill:none;stroke:rgba(255,255,255,.25);stroke-width:8}
.ring-v{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ring text{fill:#fff;font-size:18px;font-weight:800;font-family:Futura,"Jost","Century Gothic",system-ui,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tile{background:rgba(255,255,255,.13);border-radius:12px;padding:.55rem .6rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.tile .ico{width:1.1rem;height:1.1rem;opacity:.95;margin-bottom:.1rem}
.tile small{font-size:.74rem;opacity:.88}
.tile b{font-weight:500;font-size:1.02rem;overflow-wrap:anywhere}
.tile.neg{background:rgba(224,71,58,.45)}
.accion{display:flex;align-items:center;gap:.65rem;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:.75rem .8rem;cursor:pointer;font-weight:500;color:var(--ink);text-align:left}
.accion-ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.accion-ic.ing{background:var(--brand)}
.accion-ic.gas{background:#FF6B1A}
.badge{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c)}
.badge .ico{width:1.1rem;height:1.1rem}
.proximos{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.prox{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;border-top:1px solid var(--line)}
.prox:first-child{border-top:0}
.prox-txt{flex:1;min-width:0}
.prox-txt b{font-weight:500;display:block;line-height:1.25}
.prox-txt small{color:var(--muted);font-size:.82rem}
.prox-txt small.vence{color:var(--danger);font-weight:500}
.prox .num{font-weight:500}
.panel-tit{display:flex;align-items:center;gap:.45rem}
.panel-tit .ico{color:var(--brand)}
.hogar div{display:flex;align-items:center;gap:.6rem}
.hogar b{font-weight:500}
.hogar em{font-style:normal;color:var(--usd);font-size:.85rem}
.hg-pie{display:flex;align-items:center;gap:.65rem;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--line)}
.hg-pie p{margin:0;font-size:.9rem;color:var(--muted)}
.hg-pie b{color:var(--ink)}
.dona-box{position:relative;width:min(230px,70vw);margin:0 auto}
.dona-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dona-centro b{font-size:1.6rem;font-weight:500;color:var(--ink);line-height:1.15}
.dona-centro small{font-size:.75rem;color:var(--muted)}
.ley-barra{display:block;height:4px;border-radius:2px;background:var(--track);margin-top:.25rem;overflow:hidden}
.ley-barra i{display:block;height:100%}
.leyenda .badge{width:2rem;height:2rem}
.leyenda li>span:nth-child(2){min-width:0}
.vacio .vacio-ic{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--usd-soft);color:var(--usd);display:grid;place-items:center;margin:0 auto .6rem}
.vacio .vacio-ic .ico{width:1.5rem;height:1.5rem}
.p-ic{width:2.2rem;height:2.2rem;border-radius:10px;background:var(--usd-soft);color:var(--usd);display:grid;place-items:center;flex:none}
.p-tit{display:flex;flex-direction:column;min-width:0}
.p-tit small{color:var(--muted);font-size:.8rem}
.p-tit .p-hoy{align-self:flex-start;margin:.15rem 0}
.p-barra{height:6px;margin:.8rem 0 0}
.cobro{display:inline-flex;align-items:center;gap:.3rem}
.cobro .ico{width:.95rem;height:.95rem}
.item-mid{min-width:0}
.hecho{display:inline-flex;align-items:center;gap:.25rem;color:var(--usd)}
.hecho .ico{width:1rem;height:1rem}
.btn-link{display:inline-flex;align-items:center;gap:.35rem;margin-top:.4rem}
.sobre-nom{display:flex;align-items:center;gap:.6rem}
.btn-config{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem}
.btn-config .ico{color:var(--brand)}
.btn-del .ico{width:1.05rem;height:1.05rem}
.dona-wrap{text-align:left}
.escena{display:flex;align-items:center;gap:.4rem;background:var(--accent);color:#231B4D;border-radius:20px;padding:.75rem .5rem .5rem 1.1rem;margin-bottom:.8rem;overflow:hidden;position:relative}
.escena-txt{flex:1;min-width:0;position:relative;z-index:1}
.escena-txt b{font-size:1.2rem;font-weight:700;display:block;line-height:1.2}
.escena-txt p{margin:.3rem 0 0;font-size:.9rem;line-height:1.35}
.escena svg{width:52%;max-width:230px;flex:none;height:auto;display:block}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flota{animation:flotar 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vacio-ilus{display:block;width:92px;margin:0 auto .3rem}
.vacio-ilus svg{width:100%;height:auto;display:block}
.btn-usd{box-shadow:0 3px 0 #2A1F6E}
.yo{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:.6rem .8rem;margin-bottom:.7rem;font-size:.9rem;color:var(--muted)}
.yo .seg{margin-left:auto}
.seg-wrap{flex-wrap:wrap}
.hogar .avatar{width:2.2rem;height:2.2rem;font-size:.9rem}
.avatar{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.fondo.prop{border:2px dashed var(--accent)}
.fondo-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.3rem}
.fondo-tit{flex:1;min-width:0}
.fondo-tit b{display:block;font-weight:500;font-size:1.05rem;line-height:1.25}
.fondo-tit small,.fondo-total small{color:var(--muted);font-size:.8rem}
.fondo-total{text-align:right}
.fondo-total b{display:block;font-size:1.35rem;font-weight:500;color:var(--usd);line-height:1.15}
.propuesta{display:flex;gap:.6rem;align-items:flex-start;background:var(--bs-soft);border-radius:12px;padding:.7rem .8rem;margin-top:.6rem;font-size:.9rem}
.propuesta>.ico{color:var(--bs);margin-top:.15em}
.propuesta p{margin:0 0 .5rem}
.propuesta small{color:var(--muted)}
.prop-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.fondo-mes{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.6rem}
.fondo-mes-tit{font-size:.82rem;color:var(--muted);display:block;margin-bottom:.2rem}
.fondo-mes-tit::first-letter{text-transform:uppercase}
.fondo-p{display:flex;align-items:center;gap:.6rem;padding:.4rem 0}
.fondo-p-txt{flex:1}
.fondo-p-txt b{display:block;font-weight:500;line-height:1.2}
.fondo-p-txt small{color:var(--muted);font-size:.82rem}
.fondo-hist{margin-top:.5rem;border-top:1px solid var(--line);padding-top:.4rem}
.fondo-hist summary{cursor:pointer;display:flex;align-items:center;gap:.4rem;color:var(--usd);font-weight:500;font-size:.9rem;padding:.3rem 0;list-style:none}
.fondo-hist summary::-webkit-details-marker{display:none}
.fondo-hist ul{list-style:none;margin:.3rem 0 0;padding:0}
.fondo-hist li{display:flex;align-items:center;gap:.6rem;padding:.35rem 0}
.fondo-hist .avatar{width:1.8rem;height:1.8rem;font-size:.8rem}
.fh-txt{flex:1;display:flex;flex-direction:column;line-height:1.2}
.fh-txt small{color:var(--muted);font-size:.78rem}
.fondo-acc{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.3rem}
.btn-link.peligro{color:var(--danger)}
.check{display:flex;gap:.5rem;align-items:flex-start;font-size:.9rem;margin-bottom:.6rem}
.check input{width:1.1rem;height:1.1rem;margin-top:.15rem;accent-color:var(--brand)}
.notas{padding:.8rem}
.notas-vacio{margin:.2rem 0 .7rem}
.chat{list-style:none;margin:0 0 .7rem;padding:0;display:flex;flex-direction:column;gap:.55rem;max-height:420px;overflow-y:auto}
.msg{display:flex;align-items:flex-end;gap:.5rem;max-width:88%}
.msg.mio{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:1.9rem;height:1.9rem;font-size:.8rem}
.burbuja{background:var(--surface2);border-radius:16px 16px 16px 4px;padding:.5rem .75rem;position:relative;min-width:0}
.msg.mio .burbuja{background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px;padding-right:1.8rem}
.burbuja small{display:block;font-size:.74rem;color:var(--muted);margin-bottom:.1rem}
.msg.mio .burbuja small{color:rgba(255,255,255,.75)}
.burbuja p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94rem;line-height:1.35}
.msg-del{position:absolute;top:.3rem;right:.3rem;background:none;border:0;color:rgba(255,255,255,.75);cursor:pointer;padding:.1rem;border-radius:4px}
.msg-del .ico{width:.9rem;height:.9rem}
.nota-form{display:flex;gap:.5rem;align-items:flex-end}
.nota-form textarea{flex:1;resize:none;border:0;border-radius:20px;background:var(--surface2);color:var(--ink);padding:.6rem .9rem;font:inherit;min-height:2.6rem;max-height:140px;line-height:1.35}
.nota-env{width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:var(--accent);color:#231B4D;display:grid;place-items:center;cursor:pointer;flex:none}
.nota-env .ico{width:1.15rem;height:1.15rem}
.avatar.dib,.avatar.foto{background:none;overflow:hidden}
.avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
.tab-av{display:grid;place-items:center;height:1.75rem}
.av-tab{width:1.75rem;height:1.75rem;font-size:.8rem;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.tab[aria-selected="true"] .av-tab{box-shadow:0 0 0 2px var(--accent)}
.escena-av{position:relative;border:0;background:none;padding:0;cursor:pointer;margin-bottom:.45rem;display:inline-block;border-radius:50%}
.av-escena{width:3.4rem;height:3.4rem;font-size:1.35rem;box-shadow:0 0 0 3px #fff}
.av-escena .ico{width:1.5rem;height:1.5rem}
.av-edit{position:absolute;right:-3px;bottom:-2px;width:1.45rem;height:1.45rem;border-radius:50%;background:#4B3AAF;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--accent)}
.av-edit .ico{width:.8rem;height:.8rem}
.pf-prev{display:flex;flex-direction:column;align-items:center;gap:.4rem;margin:.2rem 0 .9rem}
.pf-grande{width:6.5rem;height:6.5rem;font-size:2.4rem;box-shadow:0 0 0 4px var(--accent)}
.pf-grande .ico{width:2.2rem;height:2.2rem}
.pf-tabs{display:flex;justify-content:center;margin-bottom:1rem}
.pf-tabs .seg button{display:inline-flex;align-items:center;gap:.35rem}
.pf-lbl{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin:.2rem 0 .5rem}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.pf-op{border:2px solid transparent;background:var(--surface2);border-radius:14px;padding:.6rem .3rem .45rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--ink)}
.pf-op .avatar{width:3.6rem;height:3.6rem}
.pf-op small{font-size:.8rem}
.pf-op[aria-pressed="true"]{border-color:var(--brand);background:var(--usd-soft)}
.pf-colores{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.pf-color{width:2.3rem;height:2.3rem;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.pf-color[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand)}
.pf-subir{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;cursor:pointer;margin-bottom:.4rem}
.pf-subir .ico{color:var(--brand)}
.pf-subir:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
h1,h2,h3,.hero-num,.dona-centro b,.escena-txt b,.fondo-total b,.fondo-tit b,.cuenta-row .num,.pf-prev b,.panel-tit,.p-rango,.mes strong,.tile b,.sobre-top b,.prox-txt b,.item-nom,.mov-cat{font-family:Futura,"Jost","Century Gothic",system-ui,sans-serif;font-weight:700}
h1,h2,.hero-num,.escena-txt b,.dona-centro b,.fondo-total b,.mes strong{font-weight:800}
h1{font-size:1.35rem;letter-spacing:0}
section>h2{font-size:1.15rem}
.hero-num{letter-spacing:-.01em}
.btn,.btn-pagar,.btn-link,.accion,.tab,.chip,.seg button,.lbl,.mini-lbl,.p-hoy,.hecho,.hero-lbl,.cobro,.pf-op small,.tasa{font-family:"Montserrat",system-ui,sans-serif;font-weight:800}
.btn,.btn-pagar,.accion>span:last-child,.p-hoy,.seg button{text-transform:uppercase;letter-spacing:.03em;font-size:.82rem}
.btn-sm{font-size:.76rem}
.chip{font-size:.7rem;letter-spacing:.02em}
.tabs .tab{font-size:.7rem;letter-spacing:.01em}
.accion>span:last-child{line-height:1.25}
.top-acc{display:flex;gap:.4rem;margin-left:auto}
.top-row .tasa{margin-left:0}
.top-btn{width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.top-btn .ico{width:1.15rem;height:1.15rem}
.top-btn .ic-ocultar,body.discreto .top-btn .ic-ver{display:none}
body.discreto .top-btn .ic-ocultar{display:inline-block}
body.discreto .top-btn#btnDiscreto{background:var(--accent);color:#231B4D}
body.discreto .num,body.discreto .hero-sub,body.discreto .hero-msg,body.discreto .cierre-row>span:last-child,body.discreto .escena-txt p,body.discreto .tip span,body.discreto .p-estado,body.discreto .barra em,body.discreto .sobre-top>span:last-child,body.discreto .fondo-p-txt small,body.discreto .cobro,body.discreto .p-meta,body.discreto .hg-pie p,body.discreto .hg-eje,body.discreto .ring text,body.discreto .mov-der .chip,body.discreto .item-der .ayuda,body.discreto .burbuja p,body.discreto .propuesta p,body.discreto .barra-pie{filter:blur(7px);transition:filter .15s}
#login{position:fixed;inset:0;z-index:210;background:linear-gradient(160deg,var(--hero1),var(--hero2));display:grid;place-items:center;padding:1.5rem;overflow:auto}
#login[hidden]{display:none}
#login .campo{text-align:left}
#login .campo input{font-size:1.05rem;letter-spacing:normal;text-align:left;margin-bottom:0}
#login .check{text-align:left;align-items:center;margin:.2rem 0 .4rem}
#login .check input{width:1.1rem;height:1.1rem;flex:none;padding:0;margin:0;border:0;background:none;font-size:1rem;letter-spacing:normal}
#login .btn-link{margin-top:.6rem}
#candado{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--hero1),var(--hero2));display:grid;place-items:center;padding:1.5rem}
#candado[hidden]{display:none}
.candado-box{background:var(--surface);color:var(--ink);border-radius:22px;padding:1.6rem 1.4rem;width:min(360px,100%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.candado-logo{width:4.5rem;height:4.5rem;border-radius:16px;display:block;margin:0 auto .8rem}
.candado-box h2{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:0 0 .3rem}
.candado-box p{color:var(--muted);margin:0 0 1rem;font-size:.92rem}
.candado-box input{width:100%;text-align:center;font-size:1.6rem;letter-spacing:.5em;padding:.6rem;border:0;border-bottom:3px solid var(--brand);border-radius:10px 10px 0 0;background:var(--surface2);color:var(--ink);margin-bottom:.4rem}
.candado-box .btn{width:100%;margin-top:.3rem}
.seg-sec{border-top:1px solid var(--line);padding:.9rem 0 .4rem}
.seg-sec:first-of-type{border-top:0;padding-top:0}
.seg-sec h3{display:flex;align-items:center;gap:.45rem;margin-bottom:.4rem}
.seg-sec h3 .ico{color:var(--brand)}
.seg-btns{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.actividad{list-style:none;margin:0 0 .5rem;padding:0;max-height:260px;overflow-y:auto}
.actividad li{padding:.45rem 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.35}
.actividad li:first-child{border-top:0}
.actividad li small{display:block;color:var(--muted);font-size:.76rem}
.consejos{margin:.2rem 0 0;padding-left:1.1rem;font-size:.88rem;color:var(--muted)}
.consejos li{margin-bottom:.35rem}
@media (max-width:420px){.top-row .tasa input{width:5.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const resolver=(d,y,m)=>d==='ultimo'?diasMes(y,m):Math.min(Math.max(1,parseInt(d,10)||1),diasMes(y,m));
const f=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const sigMes=(y,m)=>m===12?[y+1,1]:[y,m+1];
const antMes=(y,m)=>m===1?[y-1,12]:[y,m-1];
const ymStr=()=>S.y+'-'+pad(S.m);
const fecha=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const menosUno=s=>{const d=fecha(s);d.setDate(d.getDate()-1);return iso(d)};
const nomMes=(y,m,tipo='long')=>new Date(y,m-1,1).toLocaleDateString('es',{month:tipo});
const diaSemana=s=>fecha(s).toLocaleDateString('es',{weekday:'short'}).replace('.','');
const INTERVALO=/^c(\d{1,3})@(\d{4})-(\d{2})-(\d{2})$/;
const intervaloTxt=d=>{const m=String(d).match(INTERVALO);if(!m)return null;const n=+m[1];return `cada ${n%7===0?(n/7)+(n===7?' semana':' semanas'):n+' días'} desde ${m[2]}-${m[3]}-${m[4]}`};
const diasTxt=ds=>(ds||[]).map(d=>d==='ultimo'?'último':intervaloTxt(d)||d).join(', ');

const SEMANA={domingo:0,lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6};
const esSemanal=d=>typeof d==='string'&&d in SEMANA;
function diasDe(d,y,m){
  const mI=typeof d==='string'&&d.match(INTERVALO);
  if(mI){const n=+mI[1];if(!n)return[];const a=new Date(+mI[2],+mI[3]-1,+mI[4]),ini=new Date(y,m-1,1),fin=new Date(y,m,0),out=[];
    const k=Math.ceil(Math.round((ini-a)/864e5)/n);
    for(let t=new Date(a.getFullYear(),a.getMonth(),a.getDate()+k*n);t<=fin;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+n))if(t>=ini)out.push(t.getDate());
    return out}
  if(esSemanal(d)){const w=SEMANA[d],out=[];for(let i=1;i<=diasMes(y,m);i++)if(new Date(y,m-1,i).getDay()===w)out.push(i);return out}
  return [resolver(d,y,m)];
}
const diaLegible=d=>d==='ultimo'?'último':esSemanal(d)?'cada '+d:String(d);
function ocurrencias(cfg,y,m){
  const out=[],vistos=new Set();
  for(const it of cfg.plan)for(const d0 of (it.dias||[]))for(const dn of diasDe(d0,y,m)){
    const fe=f(y,m,dn);const k=it.id+fe;
    if(!vistos.has(k)){vistos.add(k);out.push({it,fecha:fe})}
  }
  return out;
}
const uniqSort=a=>[...new Set(a)].sort((x,y)=>x-y);
const ordenTipo={ahorro:0,fijo:1,sobre:2};

function calcPeriodos(p){
  const cfg=getCfg(p),movs=S.movs[p],y=S.y,m=S.m,[ny,nm]=sigMes(y,m);
  let st=uniqSort(cfg.ingresos.flatMap(i=>diasDe(i.dia,y,m)));
  let stN=uniqSort(cfg.ingresos.flatMap(i=>diasDe(i.dia,ny,nm)));
  if(!st.length){st=[1];stN=[1]}
  const ocs=[...ocurrencias(cfg,y,m),...ocurrencias(cfg,ny,nm)];
  const ps=st.map((d,i)=>{
    const inicio=f(y,m,d),fin=i<st.length-1?f(y,m,st[i+1]):f(ny,nm,stN[0]);
    const esperados=cfg.ingresos.filter(x=>diasDe(x.dia,y,m).includes(d));
    const recibidos=movs.filter(x=>x.tipo==='ingreso'&&x.fecha>=inicio&&x.fecha<fin);
    const esp=sum(esperados,'usd'),rec=sum(recibidos,'usd');
    const terminado=fin<=HOY;
    const base=terminado&&rec>0?rec:Math.max(rec,esp);
    const items=ocs.filter(o=>o.fecha>=inicio&&o.fecha<fin)
      .sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(ordenTipo[a.it.tipo]??3)-(ordenTipo[b.it.tipo]??3))
      .map(o=>({...o,pago:movs.find(x=>x.planId===o.it.id&&x.ocurrencia===o.fecha)}));
    const comp=items.reduce((s,o)=>s+num(o.it.usd),0);
    const enRango=movs.filter(x=>x.fecha>=inicio&&x.fecha<fin);
    const catsSobre=new Set(items.filter(o=>o.it.tipo==='sobre').map(o=>o.it.categoria));
    const fuera=sum(enRango.filter(x=>x.tipo==='gasto'&&!x.planId&&!catsSobre.has(x.categoria)),'usd');
    const extra=sum(enRango.filter(x=>x.tipo==='ahorro'&&!x.planId),'usd');
    const recBs=sum(recibidos.filter(x=>x.moneda==='Bs'),'usd'),espBs=sum(esperados.filter(x=>x.moneda==='Bs'),'usd');
    const bsBase=terminado?recBs:Math.max(recBs,espBs);
    // reparto entre bolívares y dólares
    let bs=bsBase;
    for(const o of items){o.con='USD';if(o.it.tipo!=='ahorro'&&o.it.moneda==='Bs'){o.con='Bs';bs-=num(o.it.usd)}}
    for(const o of items){if(o.it.tipo!=='ahorro'&&o.con!=='Bs'&&o.it.moneda==='Cualquiera'&&bs>=num(o.it.usd)){o.con='Bs';bs-=num(o.it.usd)}}
    for(const o of items){if(o.pago)o.con=o.pago.moneda==='Bs'?'Bs':'USD'}
    return{inicio,fin,esperados,recibidos,esp,rec,base,items,comp,fuera,extra,terminado,
      bsSobra:Math.max(0,r2(bs)),bsFalta:Math.max(0,r2(-bs)),contieneHoy:HOY>=inicio&&HOY<fin};
  });
  let c=0;
  for(let i=ps.length-1;i>=0;i--){ps[i].pasar=r2(c);c=Math.max(0,ps[i].comp-ps[i].base+c);ps[i].necesita=r2(c)}
  ps.forEach(P=>{P.libre=r2(P.base+P.necesita-P.comp-P.pasar);P.libreReal=r2(P.libre-P.fuera-P.extra)});
  return ps;
}

function movsMes(p){const k=ymStr();return S.movs[p].filter(x=>(x.fecha||'').slice(0,7)===k).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado||'').localeCompare(a.creado||''))}
function totales(p){const mm=movsMes(p);return{ing:sum(mm.filter(x=>x.tipo==='ingreso'),'usd'),gas:sum(mm.filter(x=>x.tipo==='gasto'),'usd'),aho:sum(mm.filter(x=>x.tipo==='ahorro'),'usd'),mm}}

  const mx=(x1+x2)/2,my=y+8*e,w=5.5*e;

function errTxt(e){const c=e&&e.code;
  if(c==='quota_exceeded')return'Se llenó el espacio de la app. Borra movimientos viejos para seguir.';
  if(c==='invalid_argument'||c==='permission-denied')return'No tienes permiso para guardar esto.';
  if(c==='resource_exhausted')return'Demasiados cambios seguidos. Espera unos segundos.';
  return'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'}
const SIN_DB='No hay conexión con FinFam y no se guardó. Revisa tu internet o vuelve a escribir el código.';
function conTiempo(pr,ms=15000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
function trasError(e){if(e&&e.code==='permission-denied'){S.sinPermiso=true;render()}
  if(e&&e.code==='timeout')return'El servidor no respondió y puede que no se haya guardado. Revisa tu internet y recarga la app.';return errTxt(e)}
async function addMov(p,data){
  const d={...data,creado:new Date().toISOString()};
  if(!S.db){toast(SIN_DB);return false}
  try{await conTiempo(S.db.doc('finanzas/'+p).collection('movs').add(d));registrar(`Registró ${d.tipo==='ingreso'?'un ingreso':d.tipo==='ahorro'?'un ahorro':'un gasto'} de ${fmt(d.usd)} en ${PERF[p]}`);return true}
  catch(e){toast(trasError(e));render();return false}
}
async function delMov(p,id){
  if(!S.db){toast(SIN_DB);return}
  const mv=S.movs[p].find(x=>x.id===id);
  try{await conTiempo(S.db.doc('finanzas/'+p).collection('movs').doc(id).delete());registrar(`Borró un movimiento${mv?' de '+fmt(mv.usd):''} en ${PERF[p]}`)}catch(e){toast(trasError(e))}
}
async function saveCfg(p,cfg){
  if(!S.db){toast(SIN_DB);return false}
  try{await conTiempo(S.db.doc('finanzas/'+p).set(cfg));registrar(`Cambió los pagos fijos de ${PERF[p]}`);return true}catch(e){toast(trasError(e));return false}
}

      bs=num($('#mBs').value);usd=num($('#mEq').value);if(bs<=0&&usd>0)bs=r2(usd*tasa);if(usd<=0&&bs>0)usd=r2(bs/tasa);

      categoria:it.tipo==='ahorro'?it.nombre:(it.categoria||'Otros'),nota:it.tipo==='ahorro'?'':it.nombre,planId:it.id,ocurrencia:fe};

function tiempo(isoTxt){
  const d=new Date(isoTxt),seg=(Date.now()-d)/1000;
  if(!isFinite(seg))return'';
  if(seg<60)return'hace un momento';
  if(seg<3600)return`hace ${Math.floor(seg/60)} min`;
  if(seg<86400)return`hace ${Math.floor(seg/3600)} h`;
  return d.toLocaleDateString('es',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'});
}

async function dbUpd(path,data){

}

async function accionFamilia(a,b){
  const F=S.fondos.find(x=>x.id===b.dataset.id);
  if(a==='yo'){guardarYo(b.dataset.q);render();return true}
  if(a==='perfil'){formPerfil(b.dataset.q);return true}
  if(a==='proponer'){formFondo(null);return true}
  if(a==='fondo-editar'&&F){formFondo(F);return true}
  if(a==='fondo-aportar'&&F){formAporte(F,b.dataset.q);return true}
  if(a==='fondo-aceptar'&&F){if(await dbUpd('finanzas/comun/fondos/'+F.id,{estado:'activo',aceptadoPor:S.yo,inicio:HOY})){registrar(`Aceptó el fondo ${F.nombre}`);toast('¡Fondo activado!');nota(`Acepté el fondo ${F.nombre}. ¡A ahorrar juntos!`)}return true}
  if(a==='fondo-rechazar'&&F){if(await dbUpd('finanzas/comun/fondos/'+F.id,{estado:'rechazado'})){registrar(`Rechazó el fondo ${F.nombre}`);toast('Propuesta rechazada.');nota(`Por ahora no acepto el fondo ${F.nombre}. Hablemos de los montos.`)}return true}
  if(a==='fondo-cancelar'&&F){if(confirm('¿Retirar esta propuesta?'))await dbDel('finanzas/comun/fondos/'+F.id);return true}
  if(a==='fondo-cerrar'&&F){if(confirm(`¿Cerrar el fondo ${F.nombre}? Los aportes quedan registrados.`)){if(await dbUpd('finanzas/comun/fondos/'+F.id,{estado:'cerrado',cierre:HOY})&&(registrar(`Cerró el fondo ${F.nombre}`),S.yo))nota(`Cerré el fondo ${F.nombre}.`)}return true}
  if(a==='fondo-borrar-aporte'){const A=S.apf.find(x=>x.id===b.dataset.id);if(A&&confirm('¿Borrar este aporte?')){if(await dbDel('finanzas/comun/aportesFondo/'+A.id)&&(registrar(`Borró un aporte de ${fmt(A.usd)} de ${PERF[A.quien]}`),A.movId))await dbDel('finanzas/'+A.quien+'/movs/'+A.movId)}return true}
  if(a==='nota-borrar'){if(confirm('¿Borrar este comentario?')&&await dbDel('finanzas/comun/notas/'+b.dataset.id))registrar('Borró un comentario');return true}
  return false;
}
async function enviarNota(form){

function gBillete(cx,cy,s,an){const k=v=>v*s;return `<g>
  <rect x="${cx-k(34)}" y="${cy-k(21)}" width="${k(68)}" height="${k(42)}" rx="${k(7)}" fill="#22B573"/>
  <rect x="${cx-k(29)}" y="${cy-k(16)}" width="${k(58)}" height="${k(32)}" rx="${k(4)}" fill="none" stroke="#9BE7C0" stroke-width="${k(2)}"/>
  <circle cx="${cx-k(23)}" cy="${cy-k(10)}" r="${k(2.5)}" fill="#9BE7C0"/><circle cx="${cx+k(23)}" cy="${cy+k(10)}" r="${k(2.5)}" fill="#9BE7C0"/>
  ${cara(cx-k(8),cx+k(8),cy-k(4),an,s*.95)}</g>`}
function gEstrella(cx,cy,r,an){return `<g>${brillo(cx,cy,r,'#FFC93C')}<path d="M${cx} ${cy-r} Q${cx} ${cy} ${cx+r} ${cy} Q${cx} ${cy} ${cx} ${cy+r} Q${cx} ${cy} ${cx-r} ${cy} Q${cx} ${cy} ${cx} ${cy-r} Z" fill="none" stroke="#D98E00" stroke-width="${r*.05}"/>${cara(cx-r*.17,cx+r*.17,cy-r*.08,an,r/48)}</g>`}
function gMatica(cx,cy,s,an){const k=v=>v*s;return `<g>
  <path d="M${cx} ${cy-k(6)} C${cx} ${cy-k(18)} ${cx} ${cy-k(26)} ${cx} ${cy-k(30)}" stroke="#22B573" stroke-width="${k(3.5)}" fill="none" stroke-linecap="round"/>
  <ellipse cx="${cx-k(11)}" cy="${cy-k(20)}" rx="${k(11)}" ry="${k(6)}" fill="#22B573" transform="rotate(-25 ${cx-k(11)} ${cy-k(20)})"/>
  <ellipse cx="${cx+k(11)}" cy="${cy-k(24)}" rx="${k(11)}" ry="${k(6)}" fill="#3CCB86" transform="rotate(25 ${cx+k(11)} ${cy-k(24)})"/>
  ${gMoneda(cx,cy-k(36),k(9),an)}
  <path d="M${cx-k(24)} ${cy-k(6)} h${k(48)} l${k(-6)} ${k(34)} h${k(-36)} z" fill="#FF6B1A"/>
  <rect x="${cx-k(27)}" y="${cy-k(10)}" width="${k(54)}" height="${k(9)}" rx="${k(3)}" fill="#FF8A3D"/>
  ${cara(cx-k(8),cx+k(8),cy+k(8),an,s*.85)}</g>`}
function dibujoSVG(d,bg){
  const inner=d==='moneda'?gMoneda(50,52,29,'feliz'):d==='cartera'?gCartera(50,60,.95,'feliz'):d==='billete'?gBillete(50,52,1,'feliz'):
    d==='estrella'?gEstrella(50,52,36,'feliz'):d==='matica'?gMatica(50,58,.95,'feliz'):gCochinito(55,56,.82,'feliz');
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="${bg}"/>${inner}</svg>`;
}
const fotoOk=f=>typeof f==='string'&&f.length<300000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(f);

function reducirFoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type||'image/'))return rej(new Error('tipo'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('leer'));
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const L=256,w=img.naturalWidth,h=img.naturalHeight,m=Math.min(w,h);if(!m)return rej(new Error('leer'));
      const c=document.createElement('canvas');c.width=c.height=L;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,L,L);x.drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,L,L);
      res(c.toDataURL('image/jpeg',.82))};img.onerror=()=>rej(new Error('leer'));img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

let ED=null;
function parseDias(s){
  const out=[];for(const raw of String(s).split(/[,;y]+/)){const t=raw.trim().toLowerCase();if(!t)continue;
    if(t.startsWith('ult')||t.startsWith('últ')){out.push('ultimo');continue}
    const w=t.replace(/^cada\s+/,'').replace(/s$/,'').trim(),w2=Object.keys(SEMANA).find(k=>k===w||k===w+'s'||k.replace(/s$/,'')===w);
    if(w2){out.push(w2==='miercoles'?'miércoles':w2==='sabado'?'sábado':w2);continue}
    const mi=t.match(/^cada\s+(\d{1,3})\s*(semanas?|d[ií]as?)\s+desde\s+(\d{4}-\d{2}-\d{2})$/);
    if(mi){const n=+mi[1]*(mi[2].startsWith('sem')?7:1);if(n<1||n>365)return null;out.push('c'+n+'@'+mi[3]);continue}
    const n=parseInt(t,10);if(!(n>=1&&n<=31))return null;out.push(n)}
  return out.length?out:null;
}

async function guardarCfg(){
  const err=$('#cErr');err.textContent='';
  const ingresos=[],plan=[];
  for(const x of ED.ingresos){const d=parseDias(x.diaTxt);if(!d||d.length!==1){err.textContent='Cada cobro necesita un solo día válido (1 a 31 o “último”).';return}
    const u=num(x.usd);if(u<=0){err.textContent='Cada cobro necesita un monto mayor que cero.';return}
    ingresos.push({id:x.id||uid(),dia:d[0],usd:r2(u),moneda:x.moneda==='Bs'?'Bs':'USD',nota:String(x.nota||'').trim()})}
  for(const x of ED.plan){const nom=String(x.nombre||'').trim();if(!nom){err.textContent='Cada pago necesita un nombre.';return}
    if(sensible(nom)){err.textContent=MSG_SENS;return}
    const d=parseDias(x.diasTxt);if(!d){err.textContent=`Revisa los días de “${nom}”: usa números del 1 al 31 o “último”.`;return}
    const u=num(x.usd);if(u<=0){err.textContent=`“${nom}” necesita un monto mayor que cero.`;return}
    plan.push({id:x.id||uid(),nombre:nom,usd:r2(u),dias:d,tipo:['fijo','ahorro','sobre'].includes(x.tipo)?x.tipo:'fijo',moneda:['Bs','USD','Cualquiera'].includes(x.moneda)?x.moneda:'Cualquiera',categoria:x.categoria||'Otros'})}
  const meta=Math.min(100,Math.max(0,num(ED.ahorroMetaPct)||20));
  if(await saveCfg(S.vista,{ahorroMetaPct:meta,ingresos,plan})){cerrar();toast('Cambios guardados.')}
}

async function hashPin(pin,salt){
  const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const nuevaSal=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');

function desbloquear(){S.desbloqueadoSesion=true;S.bloqueado=false;S.fallos=0;S.ultimaAct=Date.now();$('#candado').hidden=true;render()}
function pintarCandado(){
  const c=$('#candado');if(!S.bloqueado){c.hidden=true;return}
  c.hidden=false;
  const logo=($('.logo-img')||{}).src||'';
  const espera=S.esperaHasta>Date.now();
  c.innerHTML=`<form class="candado-box" id="fCand" novalidate>
    ${logo?`<img src="${logo}" alt="" class="candado-logo">`:''}
    <h2>${ic('lock-keyhole')} FinFam está bloqueado</h2>
    <p>${S.segListo?'Escribe tu PIN para ver tus finanzas.':'Verificando tu cuenta…'}</p>
    <input id="cPin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="PIN" ${!S.segListo||espera?'disabled':''} autofocus>
    <div class="err" id="cErr">${espera?`Demasiados intentos. Espera ${Math.ceil((S.esperaHasta-Date.now())/1000)} segundos.`:''}</div>
    <button class="btn btn-usd" type="submit" ${!S.segListo||espera?'disabled':''}>Desbloquear</button>
  </form>`;
  iconos();
  const i=$('#cPin');if(i&&!i.disabled)i.focus();
  $('#fCand').onsubmit=async e=>{
    e.preventDefault();const pin=$('#cPin').value;
    if(!S.seg||!S.seg.pin){desbloquear();return}
    if(await hashPin(pin,S.seg.salt)===S.seg.pin){desbloquear();return}
    S.fallos++;
    if(S.fallos>=5){S.esperaHasta=Date.now()+60000;S.fallos=0;registrar('Hubo 5 intentos fallidos de PIN');setTimeout(pintarCandado,60500)}
    pintarCandado();if(!(S.esperaHasta>Date.now()))$('#cErr').textContent=`PIN incorrecto. Te quedan ${5-S.fallos} intentos.`;
  };
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{S.ultimaAct=Date.now()},{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){S.ocultoDesde=Date.now();return}
  const min=num(S.seg&&S.seg.autoMin)||5;
  if(S.seg&&S.seg.pin&&!S.bloqueado&&S.ocultoDesde&&Date.now()-S.ocultoDesde>min*60000)bloquear();
});
setInterval(()=>{const min=num(S.seg&&S.seg.autoMin)||5;if(S.seg&&S.seg.pin&&!S.bloqueado&&Date.now()-S.ultimaAct>min*60000)bloquear()},20000);

async function formSeguridad(){
  const tiene=!!(S.seg&&S.seg.pin);
  const sinCuenta=!S.uid||!S.db;
  abrir(`${cabecera('Seguridad')}
    <div class="seg-sec"><h3>${ic('lock-keyhole')} Bloqueo con PIN</h3>
    ${sinCuenta?`<p class="ayuda">El bloqueo necesita que inicies sesión.</p>`:
    tiene?`<p class="ayuda">Activo en tu cuenta. FinFam pide tu PIN al abrirse y se bloquea solo si no la usas.</p>
      <div class="campo"><label for="sAuto">Bloquear después de</label><select id="sAuto">${[1,5,15,30].map(m=>`<option value="${m}" ${num(S.seg.autoMin||5)===m?'selected':''}>${m} ${m===1?'minuto':'minutos'} sin uso</option>`).join('')}</select></div>
      <div class="campo"><label for="sAct">PIN actual</label><input id="sAct" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="dos"><div class="campo"><label for="sNew">PIN nuevo (opcional)</label><input id="sNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
      <div class="campo"><label for="sNew2">Repite el PIN nuevo</label><input id="sNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div></div>
      <div class="err" id="sErr"></div>
      <div class="seg-btns"><button type="button" class="btn btn-usd" data-s="guardar">Guardar cambios</button><button type="button" class="btn" data-s="bloquear">Bloquear ahora</button><button type="button" class="btn-link peligro" data-s="quitar">Quitar el PIN</button></div>`:
    `<p class="ayuda">Protege FinFam con un PIN de 4 a 6 números. Te lo pedirá al abrirla y cuando pase un rato sin usarla. Cada persona tiene su propio PIN.</p>
      <div class="dos"><div class="campo"><label for="sNew">PIN nuevo</label><input id="sNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
      <div class="campo"><label for="sNew2">Repite el PIN</label><input id="sNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div></div>
      <div class="err" id="sErr"></div>
      <div class="seg-btns"><button type="button" class="btn btn-usd" data-s="activar">Activar bloqueo</button></div>`}
    </div>
    <div class="seg-sec"><h3>${ic('eye-off')} Modo discreto</h3>
      <label class="check"><input type="checkbox" id="sDisc" ${S.discreto?'checked':''}> Ocultar los montos en pantalla, para usar FinFam en público sin que otros vean tus cifras. También lo activas con el ojo de arriba.</label></div>
    <div class="seg-sec"><h3>${ic('history')} Actividad reciente</h3><ul class="actividad" id="sActList"><li class="ayuda">Cargando…</li></ul>
      <p class="ayuda">Si ves un cambio que nadie de la familia hizo, cambia el código familiar.</p></div>
    <div class="seg-sec"><h3>${ic('download')} Respaldo</h3>
      <p class="ayuda">Descarga una copia de todos los datos o carga una copia guardada. Guarda el archivo en un lugar privado, nunca en GitHub.</p>
      <div class="seg-btns"><button type="button" class="btn" data-s="exportar">Descargar respaldo</button><label class="btn">Cargar respaldo<input type="file" accept="application/json,.json" id="sImp" class="sr"></label></div></div>
    <div class="seg-sec"><h3>${ic('log-out')} Este teléfono</h3><p class="ayuda">Desconectar este teléfono de FinFam. Para volver a entrar habrá que escribir el código familiar.</p><div class="seg-btns"><button type="button" class="btn" data-s="salir">Desconectar</button></div></div>
    <div class="seg-sec"><h3>${ic('shield-check')} Buenas prácticas</h3>
      <ul class="consejos"><li>Comparte el código familiar solo en persona o por mensaje privado, nunca en grupos.</li>
      <li>Si el código se filtra, cámbialo en Firebase y borra los teléfonos conectados en la colección miembros (ver LEEME.md).</li>
      <li>Activa tu PIN para que nadie que tome tu teléfono pueda abrir FinFam.</li>
      <li>No guardes en notas o comentarios números de tarjeta, cuentas, cédulas ni claves. FinFam los bloquea si los detecta.</li></ul></div>`);
  const d=$('#sDisc');d.onchange=()=>{S.discreto=d.checked;lsSet(DISC_KEY,S.discreto?'1':null);aplicarDiscreto()};
  const err=()=>$('#sErr');
  const guardarSeg=async data=>{try{await S.db.doc('data/users/'+S.uid+'/seguridad').set(data);return true}catch(e){err().textContent=errTxt(e);return false}};
  const bA=hoja.querySelector('[data-s="activar"]');
  if(bA)bA.onclick=async()=>{const n=$('#sNew').value,n2=$('#sNew2').value;
    if(!pinValido(n)){err().textContent='El PIN debe tener de 4 a 6 números.';return}
    if(n!==n2){err().textContent='Los dos PIN no coinciden.';return}
    const salt=nuevaSal();bA.disabled=true;
    if(await guardarSeg({pin:await hashPin(n,salt),salt,autoMin:5,actualizado:new Date().toISOString()})){S.desbloqueadoSesion=true;lsSet(PIN_FLAG,'1');registrar('Activó su bloqueo con PIN');cerrar();toast('Bloqueo con PIN activado.')}else bA.disabled=false};
  const verificar=async()=>{const a=$('#sAct').value;if(!a){err().textContent='Escribe tu PIN actual.';return false}
    if(await hashPin(a,S.seg.salt)!==S.seg.pin){err().textContent='El PIN actual no es correcto.';return false}return true};
  const bG=hoja.querySelector('[data-s="guardar"]');
  if(bG)bG.onclick=async()=>{const n=$('#sNew').value,n2=$('#sNew2').value,auto=num($('#sAuto').value)||5;
    if(!await verificar())return;
    let data={...S.seg,autoMin:auto,actualizado:new Date().toISOString()};
    if(n||n2){if(!pinValido(n)){err().textContent='El PIN nuevo debe tener de 4 a 6 números.';return}if(n!==n2){err().textContent='Los dos PIN nuevos no coinciden.';return}
      const salt=nuevaSal();data.salt=salt;data.pin=await hashPin(n,salt)}
    if(await guardarSeg(data)){if(n)registrar('Cambió su PIN');cerrar();toast('Seguridad actualizada.')}};
  const bQ=hoja.querySelector('[data-s="quitar"]');
  if(bQ)bQ.onclick=async()=>{if(!await verificar())return;
    try{await S.db.doc('data/users/'+S.uid+'/seguridad').delete();lsSet(PIN_FLAG,null);registrar('Quitó su bloqueo con PIN');cerrar();toast('Bloqueo con PIN desactivado.')}catch(e){err().textContent=errTxt(e)}};
  const bB=hoja.querySelector('[data-s="bloquear"]');if(bB)bB.onclick=()=>bloquear();
  hoja.querySelector('[data-s="exportar"]').onclick=()=>exportarRespaldo();
  const fi=$('#sImp');fi.onchange=()=>{if(fi.files&&fi.files[0])importarRespaldo(fi.files[0])};
  hoja.querySelector('[data-s="salir"]').onclick=async()=>{if(confirm('¿Desconectar este teléfono de FinFam?')){cerrar();await S.cerrarSesion()}};
  // actividad
  const lista=S.actividad.slice(0,25),ul=$('#sActList');
  if(!lista.length){ul.innerHTML='<li class="ayuda">Todavía no hay actividad registrada.</li>';return}
  if(!document.body.contains(ul))return;
  ul.innerHTML='';
  lista.forEach(a=>{const li=document.createElement('li');const quien=a.uid===S.uid?'Tú':(PERF[a.quien]||a.email||'Alguien');
    const b=document.createElement('b');b.textContent=quien;const sp=document.createElement('span');sp.textContent=' '+String(a.accion||'').charAt(0).toLowerCase()+String(a.accion||'').slice(1);
    const sm=document.createElement('small');sm.textContent=tiempo(a.fecha);li.append(b,sp,sm);ul.appendChild(li)});
}

/* ---------- respaldo ---------- */
const RUTAS_OK=p=>/^(finanzas|perfiles)(\/[A-Za-z0-9_\-.~:@+]+)+$/.test(p)&&p.split('/').length%2===0;
async function exportarRespaldo(){
  if(!S.db){toast('Inicia sesión primero.');return}
  const docs={};
  const leerDoc=async p=>{const s=await S.db.doc(p).get();if(s.exists)docs[p]=s.data()};
  const leerCol=async c=>{const s=await S.db.collection(c).get();s.docs.forEach(d=>{docs[c+'/'+d.id]=d.data()})};
  try{
    await leerDoc('finanzas/ajustes');
    for(const p of Object.keys(PERF)){await leerDoc('finanzas/'+p);await leerCol('finanzas/'+p+'/movs')}
    for(const c of ['notas','fondos','aportesFondo','actividad'])await leerCol('finanzas/comun/'+c);
    await leerCol('perfiles');
  }catch(e){toast('No se pudo leer todo para el respaldo.');return}
  const blob=new Blob([JSON.stringify({app:'FinFam',version:1,fecha:new Date().toISOString(),docs},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finfam-respaldo-${HOY}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  registrar('Descargó un respaldo de FinFam');toast('Respaldo descargado. Guárdalo en un lugar seguro.');
}
async function importarRespaldo(file){
  if(!S.db){toast('Inicia sesión primero.');return}
  let j;try{j=JSON.parse(await file.text())}catch(_){toast('Ese archivo no es un respaldo de FinFam.');return}
  if(!j||j.app!=='FinFam'||typeof j.docs!=='object'){toast('Ese archivo no es un respaldo de FinFam.');return}
  const ent=Object.entries(j.docs).filter(([p,d])=>RUTAS_OK(p)&&d&&typeof d==='object'&&!Array.isArray(d));
  if(!ent.length){toast('El respaldo está vacío.');return}
  if(!confirm(`Se cargarán ${ent.length} registros y reemplazarán los que tengan el mismo nombre. ¿Continuar?`))return;
  try{for(let i=0;i<ent.length;i+=400){const b=S.db.batch();ent.slice(i,i+400).forEach(([p,d])=>b.set(S.db.doc(p),d));await b.commit()}
    registrar(`Importó un respaldo con ${ent.length} registros`);toast('Respaldo importado.');cerrar()}
  catch(e){toast(e&&e.code==='permission-denied'?'Tu cuenta no tiene permiso para importar.':'No se pudo importar el respaldo.')}
}

/* ---------- conexión ---------- */
S.yo=leerYo();
aplicarDiscreto();
$('#btnDiscreto').onclick=()=>{S.discreto=!S.discreto;lsSet(DISC_KEY,S.discreto?'1':null);aplicarDiscreto()};
$('#btnSeg').onclick=()=>formSeguridad();
render();
if(S.bloqueado)pintarCandado();
(()=>{
  const cfg=window.FINFAM_CONFIG||{};
  const lg=$('#login');
  const mostrar=html=>{lg.innerHTML=html;lg.hidden=false;iconos()};
  const logo=($('.logo-img')||{}).src||'';
  if(!window.firebase||!cfg.apiKey||/PEGA_AQUI/.test(JSON.stringify(cfg))){
    mostrar(`<div class="candado-box">${logo?`<img src="${logo}" alt="" class="candado-logo">`:''}<h2>Falta configurar FinFam</h2><p>Copia los datos de tu proyecto de Firebase en el archivo config.js. Las instrucciones están en LEEME.md.</p></div>`);
    S.sinGuardar=true;S.bloqueado=false;$('#candado').hidden=true;render();return;
  }
  const app=firebase.initializeApp(cfg),auth=app.auth(),db=app.firestore();
  try{db.settings({experimentalForceLongPolling:true,merge:true})}catch(_){}
  const listoAuth=auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{}));
  let subs=[],fallosCod=0,esperaCod=0,entrando=false;
  function pantallaCodigo(msg=''){
    S.bloqueado=false;$('#candado').hidden=true;
    mostrar(`<form class="candado-box" id="fCod" novalidate>
      ${logo?`<img src="${logo}" alt="" class="candado-logo">`:''}
      <h2>Bienvenido a FinFam</h2><p>Escribe el código familiar que te dio Adriana. Solo lo pedimos una vez en este teléfono.</p>
      <div class="campo"><label for="cdTxt">Código familiar</label><input id="cdTxt" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
      <label class="check"><input type="checkbox" id="cdVer"> Mostrar el código</label>
      <div class="err" id="cdErr">${esc(msg)}</div>
      <button class="btn btn-usd" type="submit">Entrar</button>
    </form>`);
    $('#cdVer').onchange=e=>{$('#cdTxt').type=e.target.checked?'text':'password'};
    $('#fCod').onsubmit=async e=>{
      e.preventDefault();const err=$('#cdErr'),b=e.target.querySelector('[type=submit]'),codigo=$('#cdTxt').value.normalize('NFC').replace(/[\u2010-\u2015\u2212]/g,'-').replace(/\s+/g,' ').trim();
      if(esperaCod>Date.now()){err.textContent=`Demasiados intentos. Espera ${Math.ceil((esperaCod-Date.now())/1000)} segundos.`;return}
      if(!codigo){err.textContent='Escribe el código familiar.';return}
      b.disabled=true;err.textContent='';entrando=true;
      try{
        await listoAuth;
        if(!auth.currentUser)await auth.signInAnonymously();
        await auth.currentUser.getIdToken(true);
        let ok=false,ultimo=null;
        for(let i=0;i<3&&!ok;i++){try{await db.doc('miembros/'+auth.currentUser.uid).set({codigo,creado:new Date().toISOString()});ok=true}catch(x){ultimo=x;if(x&&x.code==='permission-denied'&&i<2){await new Promise(r=>setTimeout(r,800));await auth.currentUser.getIdToken(true)}else break}}
        if(!ok)throw ultimo;
        fallosCod=0;entrando=false;conectar(auth.currentUser);
      }catch(er){
        entrando=false;b.disabled=false;
        if(er&&er.code==='permission-denied'){fallosCod++;if(fallosCod>=5){esperaCod=Date.now()+60000;fallosCod=0}err.textContent='Ese código no es correcto.'}
        else if(er&&er.code==='auth/operation-not-allowed')err.textContent='Falta activar el acceso anónimo en Firebase (ver LEEME.md).';
        else err.textContent='Sin conexión. Revisa tu internet e inténtalo de nuevo.';
      }
    };
    const i=$('#cdTxt');if(i)i.focus();
  }
  S.cerrarSesion=async()=>{const u=auth.currentUser;try{if(u&&u.isAnonymous)await u.delete()}catch(_){}try{await auth.signOut()}catch(_){}};
  function limpiar(){subs.forEach(f=>{try{f()}catch(_){}});subs=[];S.db=null;S.uid=null;
    for(const p of Object.keys(PERF)){S.cfg[p]=null;S.movs[p]=[]}S.notas=[];S.fondos=[];S.apf=[];S.perfiles={};S.actividad=[];render()}
  function conectar(u){
    conectadoUid=u.uid;
    lg.hidden=true;lg.innerHTML='';
    S.db=db;S.uid=u.uid;S.email='';S.sinGuardar=false;S.sinPermiso=false;
    const fallo=e=>{if(e&&e.code==='permission-denied'){S.sinPermiso=true;render()}};
    const on=(ref,fn,err=fallo)=>subs.push(ref.onSnapshot(fn,err));
    on(db.doc('data/users/'+S.uid+'/seguridad'),s=>{
      S.seg=s.exists?s.data():null;S.segListo=true;
      if(S.seg&&S.seg.pin){lsSet(PIN_FLAG,'1');if(!S.desbloqueadoSesion&&!S.bloqueado)bloquear();else if(S.bloqueado)pintarCandado()}
      else{lsSet(PIN_FLAG,null);if(S.bloqueado)desbloquear()}
    },()=>{S.segListo=true;if(S.bloqueado&&!S.seg){lsSet(PIN_FLAG,null);desbloquear()}});
    on(db.doc('finanzas/ajustes'),s=>{const d=s.exists?s.data():null;if(d&&num(d.tasa)>0)S.tasa=num(d.tasa);render()});
    for(const p of Object.keys(PERF)){
      on(db.doc('finanzas/'+p),s=>{S.cfg[p]=s.exists?s.data():null;render()});
      on(db.doc('finanzas/'+p).collection('movs'),s=>{S.movs[p]=s.docs.map(d=>({id:d.id,...d.data()}));render()});
    }
    const lista=s=>s.docs.map(d=>({id:d.id,...d.data()}));
    on(db.collection('finanzas/comun/notas'),s=>{S.notas=lista(s);render()});
    on(db.collection('finanzas/comun/fondos'),s=>{S.fondos=lista(s);render()});
    on(db.collection('finanzas/comun/aportesFondo'),s=>{S.apf=lista(s);render()});
    on(db.collection('finanzas/comun/actividad').orderBy('fecha','desc').limit(40),s=>{S.actividad=lista(s)},()=>{});
    on(db.collection('perfiles'),s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.perfiles=o;render()});
    render();
  }
  let conectadoUid=null;
  auth.onAuthStateChanged(async u=>{
    if(entrando)return;
    if(u&&u.uid===conectadoUid)return;
    limpiar();conectadoUid=null;
    if(!u){pantallaCodigo();return}
    for(let i=0;i<3;i++){
      try{await u.getIdToken();const m=await db.doc('miembros/'+u.uid).get();if(m.exists){conectar(u);return}break}
      catch(_){await new Promise(r=>setTimeout(r,700))}
    }
    pantallaCodigo();
  });
})();
})();
</script>
